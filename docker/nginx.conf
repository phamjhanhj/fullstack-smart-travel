limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'" always;

    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @backend_unavailable;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append so clients cannot spoof the address used by rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"status_code":413,"message":"Du lieu gui len vuot qua gioi han cho phep","data":{"code":"PAYLOAD_TOO_LARGE"}}';
    }

    location @rate_limited {
        internal;
        default_type application/json;
        return 429 '{"status_code":429,"message":"Qua nhieu yeu cau, vui long thu lai sau","data":{"code":"RATE_LIMITED"}}';
    }

    location @backend_unavailable {
        internal;
        default_type application/json;
        return 503 '{"status_code":503,"message":"Dich vu tam thoi khong kha dung, vui long thu lai sau","data":{"code":"SERVICE_UNAVAILABLE"}}';
    }
}
